[package]
name = "reason"
version = "0.1.0"
edition = "2021"
description = "AI-native Git client dashboard — GTK C+Rust"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = "0.9"
glib = "0.20"
gio = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
